- name: tenrec
  common_name: Malagasy common tenrec
  taxon_id: 9305
  genome_build: TENREC
  ensembl_release: 112
  ensembl_dataset: tecaudatus_gene_ensembl  # NOTE: Tenrec ecaudatus is NOT in
  # Ensembl Vertebrates (only Echinops telfairi is). Backbone builds against
  # this dataset will fail at BioMart until either (a) Ensembl adds the
  # species or (b) we substitute echinops_telfairi as a phylogenetic proxy.
  ensembl_prefix: tecaudatus
  ensembl_species: tenrec_ecaudatus
  gene_id_prefix: ENSETEG
  menstruates: false  # see notes; literature pin 2026-05-27
  spontaneous_decidualization: false
  tier: B
  source_datasets: [GSE274701]
  notes: |
    Trait label PINNED 2026-05-27 to trait-NEGATIVE (induced
    deciduator, seasonal estrous cycle). Tenrec has a hemochorial
    placenta (Carter, Blankenship, Künzle, Enders 2004, Placenta),
    but hemochorial != menstrual (mouse, rat, guinea pig are
    hemochorial and trait-negative). Strassmann 1996 (QRB) — the
    canonical menstrual-species catalog — does NOT list tenrec.
    Nicoll & Racey 1985 (Reproduction 74:47) describe a
    follicular/ovulatory cycle, not a menstrual one; Poppitt &
    Speakman 1994 (Physiol Zool 67) describe seasonal breeding
    with defined gestation, no cyclic endometrial sloughing.
    The afrotherian-menstruation argument originates from elephant
    shrew (Macroscelididae, Emera & Wagner 2012); Tenrecidae are a
    sister Afrotherian family and the inference does not transfer.
    Year-one role in Q4.2: deep afrotherian trait-NEGATIVE outgroup
    that widens the phylogenetic span of the trait-negative pool;
    NOT a trait-positive datum.

