# Species configuration for ConvergentDecidua
#
# Tier A (year-one core, MVR 0.1): human + mouse — used by Q1–Q4.1.
# Tier B (Q4.2 phylogenetic expansion): the 8 additional species
#   present in GSE155170, GSE274701, GSE109309, and GSE30708. Ortholog
#   backbones for these are built lazily by ``wombat orthologs build
#   --target <name>``. Trait-positive = spontaneous decidualization
#   (menstruation, decidual sloughing without conceptus signal).

# --- Tier A ---

- name: human
  common_name: Human
  taxon_id: 9606
  genome_build: GRCh38
  ensembl_release: 112
  ensembl_dataset: hsapiens_gene_ensembl
  ensembl_prefix: hsapiens
  ensembl_species: homo_sapiens
  gene_id_prefix: ENSG
  menstruates: true
  spontaneous_decidualization: true
  tier: A

- name: mouse
  common_name: House mouse
  taxon_id: 10090
  genome_build: GRCm39
  ensembl_release: 112
  ensembl_dataset: mmusculus_gene_ensembl
  ensembl_prefix: mmusculus
  ensembl_species: mus_musculus
  gene_id_prefix: ENSMUSG
  menstruates: false
  spontaneous_decidualization: false
  tier: A

# --- Tier B (Q4.2 phylogenetic expansion) ---

- name: macaque
  common_name: Cynomolgus macaque  # Macaca fascicularis — actual source of
  # the scRNA data; Stadtmauer et al. 2025 (the GSE274701 paper) integrated
  # cynomolgus, not rhesus, via GSE180637 (Jiang et al. 2023, Dev Cell
  # 58:806–821, PMID 37054708). The GSE274701 deposit itself ships NO
  # macaque h5ad; macaque is brought in from this prior published dataset.
  taxon_id: 9541
  genome_build: Macaca_fascicularis_6.0
  ensembl_release: 112
  ensembl_dataset: mfascicularis_gene_ensembl
  ensembl_prefix: mfascicularis
  ensembl_species: macaca_fascicularis
  gene_id_prefix: ENSMFAG
  menstruates: true
  spontaneous_decidualization: true
  tier: B
  source_datasets: [GSE180637]

- name: baboon
  common_name: Olive baboon
  taxon_id: 9555
  genome_build: Panubis1.0
  ensembl_release: 112
  ensembl_dataset: panubis_gene_ensembl
  ensembl_prefix: panubis
  ensembl_species: papio_anubis
  gene_id_prefix: ENSPANG
  menstruates: true
  spontaneous_decidualization: true
  tier: B
  source_datasets: [GSE155170]

- name: bat_carollia
  common_name: Seba's short-tailed bat  # Carollia perspicillata, Phyllostomidae
  taxon_id: 40233
  # Gene-ID space below is Myotis lucifugus, NOT Carollia: the GSE155170
  # bat samples are biologically Carollia (confirmed by GEO sample metadata
  # GSM4696524-5 "Bat Endometrium Individual 1-2", taxon Carollia
  # perspicillata) but Marinic/Kin/Wagner aligned the reads to the Myotis
  # lucifugus Ensembl reference (ENSMLUT transcript IDs) because no usable
  # Carollia annotation existed when the paper was prepared. Trait label
  # below tracks the BIOLOGICAL organism (phyllostomids menstruate and
  # spontaneously decidualize); orthology lookups must still go through
  # mlucifugus_gene_ensembl until Ensembl ships a Carollia annotation.
  genome_build: Myoluc2.0  # alignment reference, not the source genome
  ensembl_release: 112
  ensembl_dataset: mlucifugus_gene_ensembl
  ensembl_prefix: mlucifugus
  ensembl_species: myotis_lucifugus  # alignment reference, not source taxon
  gene_id_prefix: ENSMLUG  # gene-level; counts are at ENSMLUT transcript
                            # level and need tx2gene aggregation downstream
  menstruates: true
  spontaneous_decidualization: true
  tier: B
  source_datasets: [GSE155170]
  notes: |
    Discovery 2026-05-27: earlier project notes had this species as
    Myotis lucifugus (vespertilionid, trait-negative). That was wrong
    — the inference came from the ENSMLUT gene-ID prefix in the count
    files, without checking the GEO sample-level taxon field. The GEO
    record (GSE155170 / GSM4696524-5) explicitly names Carollia
    perspicillata as the source organism; Myotis is just the alignment
    reference. The biological identity governs the trait label, so
    this entry now functions as the phyllostomid trait-positive datum
    for Q4.2 (n=2 endometrial bulk RNA-seq individuals). This closes
    the "phyllostomid bat sweep" Q4.2 gap todo without needing a new
    dataset.

- name: hamster
  common_name: Golden hamster
  taxon_id: 10036
  genome_build: MesAur1.0
  ensembl_release: 112
  ensembl_dataset: mauratus_gene_ensembl
  ensembl_prefix: mauratus
  ensembl_species: mesocricetus_auratus
  gene_id_prefix: ENSMAUG
  menstruates: false
  spontaneous_decidualization: false
  tier: B
  source_datasets: [GSE155170]
  notes: |
    GSE155170 hamster samples carry NCBI RefSeq IDs (NM_*) rather than
    Ensembl IDs — a RefSeq→Ensembl bridge will be required during the
    Q4.2 ortholog-mapping step (NCBI gene_info + Ensembl xrefs).

