  ensembl_release: 112
  ensembl_dataset: mdomestica_gene_ensembl
  ensembl_prefix: mdomestica
  gene_id_prefix: ENSMODG
  menstruates: false
  spontaneous_decidualization: false  # marsupial; no deep-invasive deciduum
  tier: B
  source_datasets: [GSE274701, GSE109309, GSE30708]

- name: armadillo
  common_name: Nine-banded armadillo
  taxon_id: 9361
