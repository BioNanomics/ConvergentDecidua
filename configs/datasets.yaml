# --- Q4 phylogenetic / cis-regulatory expansion (scoped 2025-Q4, not yet ingested) ---
# These accessions were verified live on GEO during Q4 data-availability scoping.
# Acomys cahirinus endometrial transcriptomes are NOT publicly deposited.

- accession: GSE274701
  species: multi  # opossum, tenrec, guinea_pig, mouse (deposit does NOT include macaque despite paper text)
  tissue: fetal_maternal_interface
  assay: scRNA-seq
  condition: midgestation
  spontaneous_decidualization: mixed  # trait-positive: (?tenrec); trait-negative: opossum, mouse, guinea_pig
  menstruates: mixed
  role: Q4_phylogenetic_expansion
  priority: high
  source: GEO
  expected_format: h5ad
  ingest:
    format: geo_per_species_h5ad
    # Deposit files: GSE274701_<SpeciesToken>.h5ad. Map each token to
    # our species.yaml key. Verified by directory listing 2024-05.
    filename_species_map:
      Cporcellus: guinea_pig
      Mdomestica: opossum
      Mmusculus: mouse
      Tecaudatus: tenrec
  description: |
    Mika/Wagner 2024 multi-species single-cell atlas of midgestation
    fetal-maternal interface. Primary Q4.2 substrate. Tissue is
    midgestation, not cycling endometrium — Q4.1 priming-distance
    readout does not extend; use Q3.2-style pseudobulk amplitude.
    Deposit ships one h5ad per species (no macaque, despite paper
    text); ingested via geo_per_species_h5ad which copies each file
    to results/processed/GSE274701__<species>.h5ad and writes a
    manifest h5ad at the main output path.

- accession: GSE180637
  species: macaque  # Macaca fascicularis (cynomolgus)
  tissue: placenta_fetal_maternal_interface
  assay: scRNA-seq
  condition: pregnancy_timecourse
  spontaneous_decidualization: true
  menstruates: true
  role: Q4_trait_positive_catarrhine
  priority: high
  source: GEO
  expected_format: counts
  description: |
    Jiang et al. 2023, Dev Cell 58:806–821 (PMID 37054708, doi
    10.1016/j.devcel.2023.03.012). "Identifying a dynamic transcriptomic
    landscape of the cynomolgus macaque placenta during pregnancy at
    single-cell resolution." Samples span gestation days 20–140 of a
    162-day gestation. This is the macaque reference dataset that
    Stadtmauer et al. 2025 (GSE274701) integrated against — confirmed
    by reading the data-availability section of PMC12328210 on
    2026-05-27: "macaque data were retrieved from accession number
    GSE180637." Lets us pair baboon (GSE155170, n=3) with a deep
    cynomolgus atlas as catarrhine trait-positive evidence for Q4.2.
    Ingest format TBD on first fetch (likely Cell Ranger MTX or
    Seurat RDS; will be wired through src/ingest/geo.py).

- accession: GSE109309
  species: opossum  # Monodelphis domestica
  tissue: endometrial_stromal
  assay: bulk-RNA-seq
  condition: stress_response_decidualization
  spontaneous_decidualization: false
  menstruates: false
  role: Q4_trait_negative_outgroup
  priority: medium
  source: GEO
  expected_format: counts
  description: |
    Erkenbrack/Wagner 2018 "The mammalian decidual cell evolved from a
    cellular stress response." Opossum endometrial stromal cells under
    stress vs control; 15 samples. Conceptual ancestor of Q4.1
    priming-distance hypothesis.

- accession: GSE61793
  species: human  # + cross-species components
  tissue: endometrial_stromal
  assay: ChIP-seq
  condition: TE_regulatory_landscape
  spontaneous_decidualization: true
  menstruates: true
  role: Q4_cis_regulatory
  priority: high
  source: GEO
  expected_format: bed
  description: |
    Lynch lab "Ancient transposable elements transformed the uterine
    regulatory landscape." Primary Q4.3 substrate for the MER20/MER41
    cis-rewiring (Lynch/Wagner) hypothesis. 13 samples.

- accession: GSE30708
  species: multi  # human, armadillo, opossum
  tissue: endometrial_stromal
  assay: bulk-RNA-seq
  condition: GRN_rewiring
  spontaneous_decidualization: mixed
  menstruates: mixed
  role: Q4_cis_regulatory
  priority: medium
  source: GEO
  expected_format: counts
  ingest:
    format: geo_per_species_table
    filename_species_map:
      human: human
      armadillo: armadillo
      mdo: opossum  # Monodelphis domestica
  description: |
    Wagner lab "Transposon-mediated gene regulatory network rewiring."
    Cross-species GRN backbone for Q4.3. Per-species count tables:
    human (4 samples: DIFF/UNDIFF Abs replicates 1-2), armadillo (n=1
    count column), opossum/mdo (n=1, RPKM-normalized — not raw counts).
    Thin per-species replication is descriptive only; analytical value
    is the qualitative cross-species DE-pattern overlay.

- accession: GSE155170
  species: multi  # mouse, ground_squirrel, baboon, hamster, bat (Carollia perspicillata)
  tissue: endometrium
  assay: bulk-RNA-seq
  condition: implantation_evolution
  spontaneous_decidualization: mixed  # trait-positive: baboon, Carollia (phyllostomid bat menstruates); trait-negative: mouse, ground_squirrel, hamster
  menstruates: mixed
  role: Q4_phylogenetic_expansion
  priority: high
  source: GEO
  expected_format: counts
  ingest:
    format: geo_per_sample_bulk
    # Filename pattern: GSM<id>_<Species>_Endometrium_Individual_<n>[_Replicate_<m>].txt.gz
    # Each file is a 2-col TSV: gene_id<TAB>count. One h5ad per species
    # is written to results/processed/GSE155170__<species_key>.h5ad.
    filename_species_map:
      Baboon: baboon
      Hamster: hamster
      Bat: bat_myotis
      Squirrel: ground_squirrel
      Mouse: mouse
  description: |
    Marinic/Wagner (Kin et al.) "Evolutionary transcriptomics implicates
    HAND2 in the origins of implantation and regulation of gestation
    length." 16 endometrial bulk-RNA samples across 5 species:
    Papio anubis (baboon, 3), Mesocricetus auratus (hamster, 6 incl.
    replicates), Carollia perspicillata (bat, 2), Ictidomys
    tridecemlineatus (13-lined ground squirrel, 2), Mus musculus
    (mouse, 3). Trait-positive: baboon + bat. Trait-negative: mouse,
    hamster, ground squirrel. Per-sample raw count tables; one h5ad
    per species is written by the geo_per_sample_bulk ingest path.
