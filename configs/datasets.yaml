  # Seurat RData; requires R + Seurat (see docs/REPRODUCE.md). UE_DSC is the
  # decidual stromal cell subset — our primary target population. UE_all is
  # 7GB compressed and not needed for the stromal atlas.
  ingest:
    format: seurat_rdata
    include: [UE_DSC]

