[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convergent-decidua"
version = "0.1.0"
description = "A reproducible comparative atlas for the evolution of decidualization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.1",
    "scanpy>=1.10",
    "anndata>=0.10",
    "muon>=0.1.6",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "requests>=2.31",
    "pandas>=2.0",
    "tabulate>=0.9",
    "bioframe>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]
atlas = [
    "streamlit>=1.35",
    "plotly>=5.22",
]
ingest = [
    "GEOparse>=2.0",
    "requests>=2.31",
    "xlrd>=2.0",          # GSE104721 ships an old-format .xls
]
workflow = [
    "snakemake>=8.0",
]
all = [
    "convergent-decidua[dev,atlas,ingest,workflow]",
]

[project.scripts]
wombat = "wombat.cli:cli"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["wombat", "src", "decidual_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# real_data tests need real artifacts in results/ and are skipped by default.
# Run them explicitly with: pytest -m real_data
addopts = "-m 'not real_data'"
markers = [
    "real_data: tests that require real datasets in results/ (skipped in CI by default)",
]

[tool.hatch.build.targets.wheel]
packages = ["wombat"]
